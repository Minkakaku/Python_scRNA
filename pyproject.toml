[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-scrna-workflow"
version = "0.1.0"
description = "Reusable Scanpy single-cell RNA-seq workflow"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["scrna_workflow*"]
