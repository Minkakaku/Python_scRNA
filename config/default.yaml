# 公共分析默认值；项目在 projects/<项目>/config/config.yaml 覆盖差异项。
copy_cellranger_outputs: false

min_genes: 200
min_cells: 3
max_genes: 8000
max_counts: 50000
max_pct_mt: 20
max_pct_ribo: 100
expected_doublet_rate: 6.0
scrublet_threshold: null

cluster_method: leiden
n_pcs: 30
n_neighbors: 15
resolution: 0.8
batch_effect: null
n_top_genes: 2000
regress_covariates: [total_counts, pct_counts_mt]
random_seed: 1234

marker_method: wilcoxon
marker_logfc: 1.0
marker_fdr: 0.05
marker_min_pct: 0.25

annotation_database: manual
celltypist_model: null

# 公共服务器四平台矩阵读取；samples.tsv 的 platform 列可逐样本覆盖。
input_platform: 10x
matrix_join: inner

# 已注释细胞类型 marker 沿用服务器正向筛选阈值，不作为条件组间检验。
celltype_marker_logfc: 0.25
celltype_marker_min_pct: 0.1

# 按需执行 VDJ；alignment 是相似氨基酸序列克隆簇，identity 为精确氨基酸匹配。
vdj_method: TCR
vdj_metric: alignment
vdj_cutoff: 15
vdj_min_network_cells: 3
